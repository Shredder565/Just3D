# Builds the Windows download and publishes a GitHub release whenever a version tag (v127, v128, ...) is pushed.
# The release notes are that version's section of CHANGELOG.md. It can also be run by hand from the Actions tab (enter the tag): it then builds the current main and creates the tag itself.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build and release, for example v127'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build the Windows zip
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cp src/Just3D.html launcher/app.html
          mkdir -p "dist/Just3D-$TAG"
          (cd launcher && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui" -o "../dist/Just3D-$TAG/Just3D-$TAG.exe" .)
          cp CHANGELOG.md "dist/Just3D-$TAG/CHANGELOG.txt"
          sed "s/@VER@/$TAG/g" tools/windows-README.txt > "dist/Just3D-$TAG/README.txt"
          (cd dist && zip -qr "Just3D-$TAG-windows.zip" "Just3D-$TAG")
          # the native Windows app (own window, no browser)
          cp src/Just3D.html native/app.html
          mkdir -p "dist/Just3D-$TAG-native"
          (cd native && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui" -o "../dist/Just3D-$TAG-native/Just3D-$TAG-native.exe" .)
          cp CHANGELOG.md "dist/Just3D-$TAG-native/CHANGELOG.txt"
          sed "s/@VER@/$TAG/g" tools/native-README.txt > "dist/Just3D-$TAG-native/README.txt"
          (cd dist && zip -qr "Just3D-$TAG-windows-native.zip" "Just3D-$TAG-native")
          # release notes = this version's section of the changelog
          awk -v t="## $TAG " 'index($0,t)==1{p=1;next} p&&/^## /{exit} p' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || echo "Just3D $TAG" > dist/notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/Just3D-$TAG-windows.zip" "dist/Just3D-$TAG-windows-native.zip" --clobber
            gh release edit "$TAG" --notes-file dist/notes.md
          else
            gh release create "$TAG" "dist/Just3D-$TAG-windows.zip" "dist/Just3D-$TAG-windows-native.zip" --target "${{ github.sha }}" --title "Just3D $TAG" --notes-file dist/notes.md --latest
          fi
